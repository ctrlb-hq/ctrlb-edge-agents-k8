apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: otel
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      filelog:
        include_paths:
        - /var/log/containers/*.log
        multiline_parser:
          type: json

    processors:
      batch:
        send_batch_size: 1000
        timeout: 10s

      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128

      resource_detection:
        detectors: [env, system, docker, kubernetes]

    exporters:
      otlphttp/ctrlb-logs:
        endpoint: https://<INSTANCE_HOST>/engine/api/default/<STREAM_NAME>/_otel
        compression: gzip
        headers:
          Authorization: Basic <API_TOKEN>

      otlphttp/ctrlb-traces:
        endpoint: https://<INSTANCE_HOST>/engine/api/default
        compression: gzip
        headers:
          stream-name: <STREAM_NAME>
          Authorization: Basic <API_TOKEN>

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource_detection]
          exporters: [otlphttp/ctrlb-traces]

        logs:
          receivers: [otlp, filelog]
          processors: [memory_limiter, batch, resource_detection]
          exporters: [otlphttp/ctrlb-logs]
